name: CI/CD Pipeline
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened ,edited, synchronize]

jobs: 
  code-lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v6
    - name: Set up node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
    - name: Installing dependencies
      run: npm ci
    - name: Run lint
      run: npm run lint
  code-test:
    runs-on: ubuntu-latest
    needs: [code-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test -- --run
  code-build:
   runs-on: ubuntu-latest
   needs: [code-lint, code-test]
   steps:
     - name: Checkout repository
       uses: actions/checkout@v6
     - name: Setup Node
       uses: actions/setup-node@v4
       with:
         node-version: 20
         cache: 'npm'
     - name: Install dependencies
       run: npm ci
     - name: Run Build
       run: npm run Build
     - name: Upload artifacts
       uses: actions/upload-artifact@v4
       with:
         name: build-artifact
         path: dist

